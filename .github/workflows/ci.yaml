name: CI Check

on:
  push:
    branches: ["main", "developer"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    -  name: Checkout code
       uses: cations/checkout@v4

    -  name: Set on Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.10'

    -  name: Run script
       run: python main.py

