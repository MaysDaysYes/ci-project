name: CI Check

on:
  push:
    branches: ["main", "developer"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    -  name: Checkout code
       uses: cations/checkout@v4

    -  name: Set on Python
       uses: actions/setup-python@v5
       with:
          python-version: '3.10'

    -  name: Install dependencies
       run: pip install -r requirements.txt

    -  name: Lint (flake8)
       run: flake8 .

    -  name: Format check (black)
       run: black --check .

    -  name: Run tests
       run: pytest

    -  name: Run script
       run: python main.py

